<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FrontierX — Central AI Brain Dashboard</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #11171f;
    --panel-2: #171f2a;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #26d07c;
    --accent-2: #1f6feb;
    --warn: #d29922;
    --danger: #da3633;
    --border: #233042;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 20px; background: linear-gradient(90deg, #0f1722 0%, #142033 100%); border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
  header h1 span { color: var(--accent); font-weight: 800; }
  .status-pill { display:inline-flex; align-items:center; gap:8px; padding: 4px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); }
  .dot { width:8px; height:8px; border-radius:50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.danger { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  main { display: grid; grid-template-columns: 320px 1fr 340px; gap: 16px; padding: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .panel h2 { margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600;}
  .panel h3 { margin: 2px 0 8px; font-size: 15px; }
  .robot-card, .object-card, .log-line, .task-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px;}
  .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row b { color: var(--text); font-weight: 600; }
  .battery { position: relative; width: 100%; height: 8px; background:#222a35; border-radius: 4px; overflow:hidden; margin-top: 4px;}
  .battery > div { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent));}
  .battery.low > div { background: linear-gradient(90deg, var(--warn), var(--danger));}
  .tag { display:inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; background:#1e2b3f; color:#bcd3ef; margin-right: 4px; margin-top: 3px; }
  .tag.cap { background:#1b2a1f; color:#a7e6bd; border:1px solid #23502f;}
  .mid-top { display:flex; gap:14px; align-items:stretch;}
  .world-canvas { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #0e151f; border:1px solid var(--border); border-radius: 10px; overflow:hidden;}
  canvas { display:block; width: 100%; height: 100%; }
  .cmd-input { display:flex; gap: 8px; margin-top: 10px; }
  .cmd-input input { flex:1; background:#0c131d; color:var(--text); border:1px solid var(--border); padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .cmd-input input:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px #1f6feb33; }
  .btn { padding: 9px 14px; background: var(--accent); color: #05240f; border: none; border-radius: 8px; font-weight: 700; cursor:pointer;}
  .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);}
  .btn.danger { background: var(--danger); color: white;}
  .steps { margin-top: 12px; }
  .step { display:flex; gap:10px; align-items:center; padding: 7px 10px; border-radius:6px; margin-bottom: 6px; background: var(--panel-2); border:1px solid var(--border); font-size: 13px;}
  .step .idx { width: 22px; height: 22px; border-radius: 50%; background:#1e2b3f; display:grid; place-items:center; font-size: 11px; font-weight:700; color:#9db4d2;}
  .step.done { border-color: #2f7a4e; background: #12251a;} .step.done .idx { background:#175f38; color:#c7fbdb; }
  .step.run { border-color: #b68220; background:#241c09;} .step.run .idx { background:#8c661a; color:#ffe5b0;}
  .step.fail { border-color: #8b2d2c; background:#2a1111;} .step.fail .idx { background:#8b2d2c; color:#ffcece;}
  .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .metric { background: var(--panel-2); border:1px solid var(--border); padding: 8px 10px; border-radius: 8px;}
  .metric h4 { margin: 0; font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  .metric p { margin: 4px 0 0; font-size: 18px; font-weight: 700; }
  .metric.ok p { color: var(--accent);}
  .metric.warn p { color: var(--warn);}
  .metric.err p { color: var(--danger);}
  .log-line { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color:#cdd9e5; padding:6px 8px; margin-bottom:4px;}
  .log-line .ts { color: var(--muted); margin-right: 8px; }
  .log-line.WARN { border-left: 3px solid var(--warn);}
  .log-line.ERROR { border-left: 3px solid var(--danger);}
  .robot-body { display:flex; gap:10px; align-items:flex-start;}
  .robot-body .body-icon { width: 44px; height: 44px; border-radius: 10px; display:grid; place-items:center; font-size: 22px; flex: none;}
  .robot-body.UGV .body-icon { background:#17231a; color: #3cf090; border: 1px solid #2f7a4e;}
  .robot-body.ARM .body-icon { background:#1b2235; color: #7fb0ff; border: 1px solid #2f4b84;}
  .robot-body.DRONE .body-icon { background:#271a2c; color: #e77cff; border: 1px solid #6b3486;}
  .robot-body.OFFLINE .body-icon { filter: grayscale(1); opacity: 0.5; }
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1><span>FrontierX</span> · Central AI Brain Platform</h1>
  <div style="display:flex; gap:10px; align-items:center;">
    <span class="status-pill"><span id="eStopPill" class="dot"></span> <span id="brainStatus">BRAIN ONLINE</span></span>
    <span class="status-pill"><span class="dot" id="wsDot"></span> <span id="wsStatus">Connecting…</span></span>
    <button class="btn danger" onclick="triggerEStop()">E-STOP</button>
    <button class="btn ghost" onclick="clearEStop()">Clear E-Stop</button>
  </div>
</header>

<main>
  <!-- LEFT: Robots -->
  <section>
    <div class="panel" style="margin-bottom:16px;">
      <h2>Command Interface</h2>
      <h3>Submit natural-language mission</h3>
      <div class="cmd-input">
        <input id="cmdInput" placeholder='e.g. "Find the generator and inspect it."' />
        <button class="btn" onclick="submitCommand()">Send</button>
      </div>
      <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">
        <button class="btn ghost" style="padding:6px 10px; font-size:12px" onclick="quickCmd(0)">🔍 Find + Inspect (Demo 1)</button>
        <button class="btn ghost" style="padding:6px 10px; font-size:12px" onclick="quickCmd(1)">🤖 Inspect + Arm Pick (Demo 2)</button>
      </div>
    </div>

    <div class="panel">
      <h2>Robot Registry</h2>
      <div id="robotList"></div>
    </div>
  </section>

  <!-- CENTER: Command + World Canvas + Plan/Steps -->
  <section>
    <div class="panel" style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <h2>Factory World Map (40 × 40 m)</h2>
        <div id="metrics" class="metric-grid" style="width:auto; gap: 6px;"></div>
      </div>
      <div class="world-canvas" style="margin-top:10px;">
        <canvas id="mapCanvas" width="800" height="800"></canvas>
      </div>
    </div>

    <div class="panel">
      <h2>Mission Plan & Status</h2>
      <div id="currentPlan"><p style="color:var(--muted); margin:0;">No mission active. Submit a command above to begin.</p></div>
    </div>
  </section>

  <!-- RIGHT: World Objects / Events / Recent Tasks -->
  <section>
    <div class="panel" style="margin-bottom:16px;">
      <h2>World Model Objects</h2>
      <div id="worldObjects"></div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>Recent Missions</h2>
      <div id="taskHistory"></div>
    </div>
    <div class="panel">
      <h2>Event Log</h2>
      <div id="logPanel" style="max-height:260px; overflow-y:auto;"></div>
    </div>
  </section>
</main>

<script>
const API_BASE = "http://localhost:8001";
const WS_BASE = "ws://localhost:8001/ws/telemetry";

const QUICK_CMDS = [
  "Find the generator and inspect it.",
  "Inspect the generator and pick up the damaged component.",
];

// ──────────────────────────────────────────────────────────────────────
// State
// ──────────────────────────────────────────────────────────────────────
let ws = null;
let state = { robots: [], world_objects: [], metrics: {}, e_stop: false, tasks: [] };
let logs = [];
let robotTrails = {}; // Store trail history for each robot
let animationFrame = null;
let lastTime = 0;

// ──────────────────────────────────────────────────────────────────────
// Logging
// ──────────────────────────────────────────────────────────────────────
function log(msg, level="INFO") {
  const d = new Date();
  const ts = d.toTimeString().slice(0, 8);
  logs.unshift({ ts, level, msg });
  logs = logs.slice(0, 100);
  renderLogs();
}
function renderLogs() {
  const el = document.getElementById("logPanel");
  el.innerHTML = logs.map(l => `<div class="log-line ${l.level}"><span class="ts">${l.ts}</span>[${l.level}] ${l.msg}</div>`).join("");
}

// ──────────────────────────────────────────────────────────────────────
// WebSocket
// ──────────────────────────────────────────────────────────────────────
function connect() {
  try { ws = new WebSocket(WS_BASE); } catch(e) { setTimeout(connect, 2000); return; }
  ws.onopen = () => {
    document.getElementById("wsDot").classList.remove("danger");
    document.getElementById("wsStatus").textContent = "LIVE";
    log("WebSocket telemetry connected.", "INFO");
  };
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    state.robots = d.robots || [];
    state.world_objects = d.world_objects || [];
    state.metrics = d.metrics || {};
    state.e_stop = !!d.e_stop;
    state.tasks = d.recent_tasks || [];
    
    // Update robot trails
    for (const r of state.robots) {
      if (!robotTrails[r.robot_id]) {
        robotTrails[r.robot_id] = [];
      }
      const trail = robotTrails[r.robot_id];
      const currentPos = { x: r.pose?.x || 0, y: r.pose?.y || 0, yaw: r.pose?.yaw || 0 };
      
      // Add new position if it's different from the last one
      if (trail.length === 0 || 
          Math.abs(trail[trail.length - 1].x - currentPos.x) > 0.1 ||
          Math.abs(trail[trail.length - 1].y - currentPos.y) > 0.1) {
        trail.push({ ...currentPos, timestamp: Date.now() });
        // Keep only last 100 positions
        if (trail.length > 100) trail.shift();
      }
    }
    
    renderAll();
  };
  ws.onclose = () => {
    document.getElementById("wsDot").classList.add("danger");
    document.getElementById("wsStatus").textContent = "Disconnected";
    log("WebSocket disconnected — retrying.", "WARN");
    setTimeout(connect, 1500);
  };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
}
connect();

// ──────────────────────────────────────────────────────────────────────
// Helpers
// ──────────────────────────────────────────────────────────────────────
function fetchJSON(path, opts={}) {
  return fetch(API_BASE + path, opts).then(r => r.json());
}
function quickCmd(i) {
  document.getElementById("cmdInput").value = QUICK_CMDS[i];
  submitCommand();
}

// ──────────────────────────────────────────────────────────────────────
// Submit command
// ──────────────────────────────────────────────────────────────────────
async function submitCommand() {
  const cmd = document.getElementById("cmdInput").value.trim();
  if (!cmd) return;
  log(`👤 User command: "${cmd}"`);
  const planEl = document.getElementById("currentPlan");
  planEl.innerHTML = `<p style="color:var(--warn)">⏳ Planning command…</p>`;
  try {
    const res = await fetchJSON("/api/v1/command", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ command: cmd, source: "WEB_DASHBOARD" })
    });
    if (!res || res.error) {
      planEl.innerHTML = `<p style="color:var(--danger)">❌ ${res?.error || "Plan rejected"}</p>`;
      log("Plan failed: " + (res?.error || "unknown"), "ERROR");
      return;
    }
    log(`🧠 Plan ${res.plan_id ? res.plan_id.slice(0,8) : 'N/A'} generated (${res.steps?.length || 0} steps). ${res.reasoning || ""}`);
    renderPlan(res);
    // Render results as they are (plan is already executed synchronously in API)
    const stepMap = Object.fromEntries((res.execution_results||[]).map(r => [r.step_id, r]));
    const steps = Array.isArray(res.steps) ? res.steps : [];
    for (const s of steps) {
      const r = stepMap[s.step_id];
      const row = document.querySelector(`[data-step="${s.step_id}"]`);
      if (!row) continue;
      row.classList.remove("run");
      if (!r) continue;
      row.classList.add(r.success ? "done" : "fail");
      const tail = row.querySelector(".step-tail") || document.createElement("div");
      tail.className = "step-tail";
      tail.style.marginLeft = "auto";
      tail.style.fontSize = "11px";
      tail.style.color = r.success ? "#3cf090" : "#ff8d8d";
      tail.innerHTML = `${r.robot_id || ""} · ${r.success ? "OK" : r.message.slice(0,60)}`;
      row.appendChild(tail);
    }
    const allOk = (res.all_steps_successful) || (res.execution_results||[]).every(x => x.success);
    if (res.inspection_report) {
      const rep = res.inspection_report;
      const findings = (rep.findings || []).slice(0, 4).map(f => `• ${f}`).join("<br/>");
      planEl.insertAdjacentHTML("beforeend",
        `<div style="margin-top:10px; padding: 10px; background: var(--panel-2); border:1px solid var(--border); border-radius:8px;">
          <div style="font-size:12px; text-transform:uppercase; color:var(--muted); letter-spacing:1px; margin-bottom:4px;">Final Mission Report — ${rep.status}</div>
          <div style="font-size:13px;">Target: <b>${rep.target_object || rep.target || "—"}</b> · Robot: <b>${rep.robot_id || rep.assigned_robot || "—"}</b> · Findings: <b>${rep.total_findings || 0}</b></div>
          ${findings ? `<div style="margin-top:6px; font-size:12px; color:#c7fbdb;">${findings}</div>` : ""}
        </div>`
      );
    }
    log(`✅ Mission ${allOk ? "COMPLETED" : "HAD FAILURES"}. Status: ${res.inspection_report?.status || "—"}`);
  } catch (err) {
    planEl.innerHTML = `<p style="color:var(--danger)">❌ ${String(err)}</p>`;
    log(String(err), "ERROR");
  }
}

function renderPlan(res) {
  const el = document.getElementById("currentPlan");
  const steps = Array.isArray(res.steps) ? res.steps : [];
  const planId = res.plan_id ? res.plan_id.slice(0,12) : 'N/A';
  
  if (steps.length === 0) {
    el.innerHTML = `
      <div style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;">Plan ID: ${planId}…</div>
      <h3 style="margin:2px 0 6px;">${res.reasoning || "Mission plan"}</h3>
      <p style="color:var(--muted); margin:0;">No steps generated for this plan.</p>
    `;
    return;
  }
  
  el.innerHTML = `
    <div style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;">Plan ID: ${planId}…</div>
    <h3 style="margin:2px 0 6px;">${res.reasoning || "Mission plan"}</h3>
    <div class="steps" id="planSteps">
      ${steps.map(s => `
        <div class="step" data-step="${s.step_id}">
          <div class="idx">${s.step_id}</div>
          <div style="flex:1;">
            <div style="font-weight:600;">${s.task_type}</div>
            <div style="color:var(--muted); font-size:11.5px;">${s.description}</div>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

// ──────────────────────────────────────────────────────────────────────
// Triggers
// ──────────────────────────────────────────────────────────────────────
async function triggerEStop() {
  log("⚠️  E-STOP triggered by dashboard.", "WARN");
  await fetchJSON("/api/v1/safety/e_stop?reason=Dashboard+button", { method: "POST" });
}
async function clearEStop() {
  log("ℹ️  E-STOP cleared.");
  await fetchJSON("/api/v1/safety/clear_e_stop", { method: "POST" });
}

// ──────────────────────────────────────────────────────────────────────
// Render functions
// ──────────────────────────────────────────────────────────────────────
function renderAll() {
  renderRobots(); renderWorldObjects(); renderMap(); renderMetrics(); renderTasks();
  document.getElementById("brainStatus").textContent = state.e_stop ? "E-STOP ACTIVE" : "BRAIN ONLINE";
  const pill = document.getElementById("eStopPill");
  pill.classList.toggle("danger", state.e_stop);
}
function iconForBody(bodyType) {
  return {"UGV":"🚗","ARM":"🦾","DRONE":"🛸","QUADRUPED":"🐕","TRACKED":"🚜"}[bodyType] || "🤖";
}
function renderRobots() {
  const el = document.getElementById("robotList");
  if (!state.robots.length) { el.innerHTML = `<p style="color:var(--muted); font-size:13px; margin:0;">No robots registered.</p>`; return; }
  el.innerHTML = state.robots.map(r => {
    const offline = r.status === "OFFLINE" || r.status === "FAULT";
    const lowBattery = r.battery_percentage < 25;
    return `
      <div class="robot-card">
        <div class="robot-body ${r.body_type} ${offline?"OFFLINE":""}">
          <div class="body-icon">${iconForBody(r.body_type)}</div>
          <div style="flex:1;">
            <div style="display:flex; justify-content:space-between;"><b>${r.name}</b><span style="color:${offline?'var(--danger)':'var(--accent)'}; font-size:11px; text-transform:uppercase;">${r.status}</span></div>
            <div style="font-size:11px; color:var(--muted);">${r.robot_id} · ${r.body_type} · ip ${r.ip_address || "—"}</div>
            <div style="margin-top:5px; display:flex; align-items:center; justify-content:space-between; font-size:12px;">
              <span>Battery <b style="color:${lowBattery?'var(--warn)':'var(--text)'};">${r.battery_percentage.toFixed(1)}%</b></span>
              <span>${r.max_linear_velocity} m/s · ${r.max_payload_kg} kg</span>
            </div>
            <div class="battery ${lowBattery?'low':''}"><div style="width:${r.battery_percentage}%"></div></div>
            <div style="margin-top:6px;">${(r.capabilities||[]).map(c => `<span class="tag cap">${c}</span>`).join("")}</div>
            <div class="row"><span>pose</span><b>(${r.pose?.x?.toFixed(2)}, ${r.pose?.y?.toFixed(2)}) yaw ${(r.pose?.yaw||0).toFixed(2)}</b></div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}
function renderWorldObjects() {
  const el = document.getElementById("worldObjects");
  if (!state.world_objects.length) { el.innerHTML = `<p style="color:var(--muted); font-size:13px; margin:0;">No tracked objects.</p>`; return; }
  el.innerHTML = state.world_objects.slice(0, 8).map(o => `
    <div class="object-card">
      <div style="display:flex; justify-content:space-between;"><b>${o.name || o.object_id}</b>
        <span class="tag" style="background:${o.status==='INSPECTED'?'#122a1b':o.status==='DAMAGED'?'#3a1515':'#1e2b3f'}; color:${o.status==='INSPECTED'?'#a7e6bd':o.status==='DAMAGED'?'#ff9494':'#bcd3ef'};">${o.status}</span>
      </div>
      <div class="row"><span>class</span><b>${o.class_name}</b></div>
      <div class="row"><span>position</span><b>(${o.x?.toFixed(2)}, ${o.y?.toFixed(2)})</b></div>
      ${o.metadata?.last_inspection_temp_c != null ? `<div class="row"><span>temp</span><b>${o.metadata.last_inspection_temp_c.toFixed(1)} °C</b></div>` : ""}
      ${o.metadata?.damage_detected ? `<div class="row"><span>damage</span><b style="color:var(--danger)">DETECTED</b></div>` : ""}
    </div>
  `).join("");
}
function renderTasks() {
  const el = document.getElementById("taskHistory");
  if (!state.tasks.length) { el.innerHTML = `<p style="color:var(--muted); font-size:13px; margin:0;">No recent missions.</p>`; return; }
  el.innerHTML = state.tasks.slice(0, 5).map(t => `
    <div class="task-card">
      <div style="display:flex; justify-content:space-between;">
        <b style="font-size:12px;">${t.command || "—"}</b>
        <span class="tag" style="background:${t.status==='COMPLETED'?'#122a1b':'#3a1515'}; color:${t.status==='COMPLETED'?'#a7e6bd':'#ff9494'};">${t.status}</span>
      </div>
      <div class="row"><span>id</span><b>${t.task_id?.slice(0,10)||"—"}…</b></div>
    </div>
  `).join("");
}
function renderMetrics() {
  const m = state.metrics || {};
  const rows = [
    ["Robots", state.robots.length, "ok"],
    ["World Objs", state.world_objects.length, "ok"],
    ["Tasks", m.tasks_executed || 0, "ok"],
    ["Safety Blocks", m.safety_violations_blocked || 0, m.safety_violations_blocked ? "warn" : "ok"],
    ["Planner Fail", m.planner_failures || 0, m.planner_failures ? "err" : "ok"],
    ["Exec Fail", m.execution_failures || 0, m.execution_failures ? "err" : "ok"],
  ];
  document.getElementById("metrics").innerHTML = rows.map(([label, val, cls]) =>
    `<div class="metric ${cls}"><h4>${label}</h4><p>${val}</p></div>`
  ).join("");
}

// ──────────────────────────────────────────────────────────────────────
// World map canvas with animation
// ──────────────────────────────────────────────────────────────────────
function renderMap() {
  const cvs = document.getElementById("mapCanvas");
  const ctx = cvs.getContext("2d");
  const W = cvs.width, H = cvs.height;
  ctx.clearRect(0,0,W,H);
  
  // Background grid
  ctx.fillStyle = "#0c1219";
  ctx.fillRect(0,0,W,H);
  const scale = Math.min(W,H)/40;  // world is 40x40m
  const off = (x) => (x + 20) * scale;
  
  // Draw grid with animation
  const time = Date.now() / 1000;
  ctx.strokeStyle = "#152030";
  ctx.lineWidth = 1;
  for (let i = -20; i <= 20; i++) {
    const alpha = 0.3 + 0.2 * Math.sin(time + i * 0.5);
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.moveTo(off(i), 0); ctx.lineTo(off(i), H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, off(i)); ctx.lineTo(W, off(i)); ctx.stroke();
  }
  ctx.globalAlpha = 1.0;
  
  // Walls with glow effect
  ctx.strokeStyle = "#334155"; ctx.lineWidth = 2;
  ctx.shadowColor = "#26d07c";
  ctx.shadowBlur = 10;
  ctx.strokeRect(off(-20), off(-20), 40*scale, 40*scale);
  ctx.shadowBlur = 0;

  // World objects with pulse animation
  for (const o of state.world_objects) {
    let color = "#475569", label = o.class_name;
    if (o.class_name === "generator")        { color = "#64748b"; label = o.status === "DAMAGED" ? "⚠ GEN" : "GEN"; }
    if (o.class_name === "damaged_component"){ color = "#c2410c"; label = "DC"; }
    if (o.class_name === "charging_dock")    { color = "#1d4ed8"; label = "🔌"; }
    if (o.class_name === "valve")            { color = "#7c3aed"; label = "VAL"; }
    const px = off(o.x), py = off(o.y);
    
    // Pulse effect for damaged/abnormal objects
    if (o.status === "DAMAGED" || o.status === "ABNORMAL") {
      const pulse = 1 + 0.2 * Math.sin(time * 3);
      ctx.strokeStyle = "#f87171"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, 18 * pulse, 0, Math.PI*2); ctx.stroke();
    }
    
    ctx.fillStyle = color;
    ctx.fillRect(px - 12, py - 12, 24, 24);
    ctx.strokeStyle = "#94a3b8"; ctx.strokeRect(px - 12, py - 12, 24, 24);
    ctx.fillStyle = "#fff"; ctx.font = "10px ui-sans-serif"; ctx.textAlign = "center";
    ctx.fillText(label, px, py + 3);
  }

  // Robot trails
  for (const [robotId, trail] of Object.entries(robotTrails)) {
    if (trail.length < 2) continue;
    
    const robot = state.robots.find(r => r.robot_id === robotId);
    if (!robot) continue;
    
    let color = "#22c55e";
    if (robot.body_type === "ARM") color = "#3b82f6";
    if (robot.body_type === "DRONE") color = "#a855f7";
    if (robot.status === "OFFLINE") color = "#64748b";
    
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6;
    
    ctx.beginPath();
    for (let i = 0; i < trail.length; i++) {
      const px = off(trail[i].x), py = off(trail[i].y);
      if (i === 0) {
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }
    }
    ctx.stroke();
    ctx.globalAlpha = 1.0;
    
    // Draw trail dots
    for (let i = 0; i < trail.length; i++) {
      const px = off(trail[i].x), py = off(trail[i].y);
      const alpha = (i / trail.length) * 0.8;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(px, py, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;
  }

  // Robots with smooth animation
  for (const r of state.robots) {
    const px = off(r.pose?.x || 0), py = off(r.pose?.y || 0);
    let color = "#22c55e";
    if (r.body_type === "ARM") color = "#3b82f6";
    if (r.body_type === "DRONE") color = "#a855f7";
    if (r.status === "OFFLINE") color = "#64748b";
    
    // Robot glow
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(r.pose?.yaw || 0);
    ctx.fillStyle = color;
    ctx.beginPath();
    if (r.body_type === "ARM") {
      ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#1e3a8a"; ctx.fillRect(0,-2,22,4);
    } else {
      ctx.moveTo(12, 0); ctx.lineTo(-10, 8); ctx.lineTo(-10, -8); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff"; ctx.font = "10px ui-sans-serif"; ctx.textAlign = "center";
    ctx.fillText(r.robot_id.slice(0, 12), px, py + 24);
    
    // Status indicator
    if (r.status === "ACTIVE" || r.status === "MOVING") {
      ctx.fillStyle = "#26d07c";
      ctx.beginPath();
      ctx.arc(px + 15, py - 15, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Animation loop
function animateMap(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const deltaTime = timestamp - lastTime;
  
  renderMap();
  
  lastTime = timestamp;
  animationFrame = requestAnimationFrame(animateMap);
}

// Start animation when page loads
window.addEventListener('load', () => {
  animationFrame = requestAnimationFrame(animateMap);
});

// Keyboard shortcut: Enter sends command
document.getElementById("cmdInput").addEventListener("keydown", e => { if (e.key === "Enter") submitCommand(); });

// Bootstrapping: if REST API unreachable, inform user once
fetch(API_BASE + "/").then(r => r.json()).then(info => {
  log(`REST API connected. Version ${info.version} · LLM ${info.llm_provider || "?"} · Skills ${info.skill_count || "?"}`);
}).catch(() => log("Cannot reach REST API at " + API_BASE + ". Start server: `python scripts/launch_brain.py` or `uvicorn frontierx_brain.api.gateway:create_app`", "WARN"));
</script>
